<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
<title>Storage — CHECKMYPC.MA</title>
<meta name="description" content="">
<link rel="icon" href="../../assets/mark.svg">
<link rel="stylesheet" href="../../assets/picker.css">
<link rel="stylesheet" href="../../assets/site.css">
<!-- Applied before first paint so a dark-mode user never sees a white flash.
     app.js takes over from here; this only sets the initial attributes. -->
<script>
(function(){
  try{
    var t=localStorage.getItem("cmp.theme.v1");
    if(t!=="dark"&&t!=="light"){
      t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    }
    document.documentElement.setAttribute("data-theme",t);
    var l=localStorage.getItem("cmp.lang.v1");
    if(l==="en"||l==="fr"||l==="ar"){
      document.documentElement.setAttribute("lang",l);
      document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");
    }
  }catch(e){}
})();
</script>
</head>
<body data-page="products">

<!-- Global navigation is injected by app.js so every page stays in sync. -->
<header id="site-header"></header>

<main>
<section class="prebuilt-hero"><h1>Storage</h1><p>Opening the filtered catalogue&hellip; <a href="../index.html?category=storage">continue</a></p></section><script>location.replace("../index.html?category=storage");</script>
</main>

<!-- Footer is injected by app.js so its 4 columns stay in sync everywhere. -->
<footer id="site-footer"></footer>

<script>window.CHECKMYPC_ROOT="../../";</script>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/app.js"></script>
</body>
</html>
